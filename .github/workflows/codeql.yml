name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Catches newly-published vulnerability patterns even when nothing changed in the repo.
    - cron: '19 3 * * 1'

jobs:
  analyze:
    runs-on: windows-latest
    permissions:
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp

      - name: Build
        run: dotnet build NetMonGui/NetMonGui.csproj -c Release

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
