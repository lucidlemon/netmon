name: Release

# Runs every push to main. <Version> in NetMonGui.csproj is the "intended" release (bump it
# there - e.g. 1.5.0 -> 1.6.0 - only when you actually want a new minor version); every push
# that doesn't change it auto-increments the patch digit instead (1.5.0, 1.5.1, 1.5.2, ...) by
# checking existing release tags, so routine pushes (docs, plugin-only fixes, etc.) never fail
# vpk with "version already exists" the way a literal re-push of the same version used to.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compute release version (auto patch-bump)
        id: get-version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          base=$(grep -oE '<Version>[^<]+' NetMonGui/NetMonGui.csproj | sed 's/<Version>//')
          major=$(echo "$base" | cut -d. -f1)
          minor=$(echo "$base" | cut -d. -f2)

          existing_patches=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName' \
            | grep -E "^v${major}\.${minor}\.[0-9]+$" \
            | sed -E "s/^v${major}\.${minor}\.//" \
            | sort -n)

          if [ -z "$existing_patches" ]; then
            version="$base"
          else
            last_patch=$(echo "$existing_patches" | tail -1)
            version="${major}.${minor}.$((last_patch + 1))"
          fi

          echo "Base version from csproj: $base -> releasing $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install vpk (Velopack CLI)
        run: dotnet tool install -g vpk

      - name: Publish app (multi-file - Velopack needs this, not the single-file bundle)
        run: dotnet publish NetMonGui/NetMonGui.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=false -o publish/app

      - name: Publish standalone portable exe (no auto-update, just a single file)
        run: dotnet publish NetMonGui/NetMonGui.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o publish/portable

      - name: Rename portable exe with version
        shell: bash
        run: cp publish/portable/NetMonGui.exe "publish/portable/NetMonGui-portable-v${{ steps.get-version.outputs.version }}.exe"

      - name: Fetch previous release (lets vpk build delta patches)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: vpk download github --repoUrl https://github.com/${{ github.repository }} --token $env:GH_TOKEN
        continue-on-error: true

      - name: Pack Velopack release
        run: >
          vpk pack -u NetMonGui -v ${{ steps.get-version.outputs.version }}
          -p publish/app -e NetMonGui.exe
          --packTitle "NetMon" --packAuthors "${{ github.repository_owner }}"

      - name: Publish release to GitHub (Setup.exe + auto-update feed)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          vpk upload github --repoUrl https://github.com/${{ github.repository }}
          --token $env:GH_TOKEN
          --publish --releaseName "NetMon v${{ steps.get-version.outputs.version }}"
          --tag v${{ steps.get-version.outputs.version }}

      - name: Attach the portable exe to the same release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release upload v${{ steps.get-version.outputs.version }}
          "publish/portable/NetMonGui-portable-v${{ steps.get-version.outputs.version }}.exe"
          --repo ${{ github.repository }}

      - name: Read Stream Deck plugin version from manifest
        id: get-sdplugin-version
        shell: bash
        run: |
          echo "version=$(jq -r '.Version' streamdeck-plugin/com.danielwinter.netmon.sdPlugin/manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Stream Deck plugin
        working-directory: streamdeck-plugin
        run: |
          npm ci
          npm run build

      - name: Pack Stream Deck plugin (.streamDeckPlugin)
        working-directory: streamdeck-plugin
        run: |
          npm install -g @elgato/cli
          streamdeck pack com.danielwinter.netmon.sdPlugin -f -o dist

      - name: Rename Stream Deck plugin with version
        shell: bash
        run: >
          cp streamdeck-plugin/dist/com.danielwinter.netmon.streamDeckPlugin
          "streamdeck-plugin/dist/NetMon-StreamDeck-Plugin-v${{ steps.get-sdplugin-version.outputs.version }}.streamDeckPlugin"

      - name: Attach the Stream Deck plugin to the same release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release upload v${{ steps.get-version.outputs.version }}
          "streamdeck-plugin/dist/NetMon-StreamDeck-Plugin-v${{ steps.get-sdplugin-version.outputs.version }}.streamDeckPlugin"
          --repo ${{ github.repository }}
