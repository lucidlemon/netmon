<!doctype html>
<head lang="en">
	<meta charset="utf-8" />
	<script src="https://sdpi-components.dev/releases/v3/sdpi-components.js"></script>
	<style>
		#status {
			font-size: 11px;
			color: var(--sdpi-color-light-grey, #969696);
			padding: 4px 16px 0;
		}
		#status.error {
			color: #e0605a;
		}
	</style>
</head>
<body>
	<sdpi-item label="Target">
		<sdpi-select id="targetSelect" setting="target" placeholder="Loading targets…"></sdpi-select>
	</sdpi-item>

	<sdpi-item label="Connection">
		<sdpi-select id="connectionSelect" setting="connection" placeholder="Loading connections…"></sdpi-select>
	</sdpi-item>

	<sdpi-item label="Metric">
		<sdpi-select setting="metric" value-type="string">
			<option value="ping">Ping</option>
			<option value="jitter">Jitter</option>
		</sdpi-select>
	</sdpi-item>

	<sdpi-item>
		<sdpi-button id="refreshButton">Refresh from NetMon</sdpi-button>
	</sdpi-item>

	<div id="status"></div>

	<script type="module">
		const API_URL = "http://127.0.0.1:47115/api/status";

		const targetSelect = document.getElementById("targetSelect");
		const connectionSelect = document.getElementById("connectionSelect");
		const status = document.getElementById("status");
		const refreshButton = document.getElementById("refreshButton");

		// Keeps whatever the persisted setting already points at, even if it's momentarily
		// not in the live list, so a fetch failure or a target that's since been removed
		// doesn't stomp the user's choice.
		function populate(select, options, current) {
			select.querySelectorAll("option").forEach((o) => o.remove());
			for (const [value, label] of options) {
				select.appendChild(new Option(label, value));
			}
			if (current && !options.some(([value]) => value === current)) {
				select.appendChild(new Option(`${current} (not currently active)`, current));
			}
			if (current) select.value = current;
		}

		async function loadFromNetMon() {
			status.textContent = "";
			status.classList.remove("error");

			let data;
			try {
				const res = await fetch(API_URL, { signal: AbortSignal.timeout(1500) });
				if (!res.ok) throw new Error(`HTTP ${res.status}`);
				data = await res.json();
			} catch (err) {
				status.textContent = "Can't reach NetMon on 127.0.0.1:47115 — make sure the app is running.";
				status.classList.add("error");
				return;
			}

			const targets = data.targets ?? [];
			if (targets.length === 0) {
				status.textContent = "NetMon is running but isn't monitoring anything yet.";
				return;
			}

			populate(
				targetSelect,
				targets.map((t) => [t.id, t.id === "default" ? `Default (${t.host})` : `${t.label} (${t.host})`]),
				targetSelect.value,
			);

			// The adapter set is the same physical NICs across every target, so any target's
			// adapter list works as the universe of connection names.
			const adapters = targets[0].adapters ?? [];
			populate(
				connectionSelect,
				adapters.map((a) => [a.name, a.name]),
				connectionSelect.value,
			);

			if (adapters.length === 0) {
				status.textContent = "NetMon isn't monitoring any adapters yet.";
				return;
			}

			status.textContent = `${targets.length} target(s), ${adapters.length} connection(s) found.`;
		}

		refreshButton.addEventListener("click", loadFromNetMon);
		document.addEventListener("DOMContentLoaded", loadFromNetMon);
		loadFromNetMon();
	</script>
</body>
